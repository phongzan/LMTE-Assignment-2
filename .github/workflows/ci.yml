name: Build and verify

on:
  push:
  pull_request:

jobs:
  windows-compile:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile with g++
        run: g++ -std=c++17 -O2 -Wall -I include src/Lexer.cpp src/Parser.cpp src/SemanticAnalyzer.cpp src/Interpreter.cpp src/Environment.cpp src/Value.cpp src/Operators.cpp src/Token.cpp src/CodeGen.cpp src/VM.cpp main.cpp -o flux.exe

      - name: Verify executable exists
        run: |
          if (Test-Path flux.exe) {
            Write-Output "✓ flux.exe compiled successfully"
            ./flux.exe examples/stock_ledger.flx
          } else {
            Write-Error "flux.exe not found"
            exit 1
          }
